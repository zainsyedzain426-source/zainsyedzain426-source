<svg width="1200" height="180" viewBox="0 0 1200 180"
xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="deepSpace" cx="30%" cy="30%" r="90%">
<stop offset="0%" stop-color="#1B1350"/>
<stop offset="45%" stop-color="#0E0A33"/>
<stop offset="100%" stop-color="#020108"/>
</radialGradient>

<radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#6E3FA8" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#6E3FA8" stop-opacity="0"/>
</radialGradient>
<radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#1EA6A0" stop-opacity="0.3"/>
<stop offset="100%" stop-color="#1EA6A0" stop-opacity="0"/>
</radialGradient>

<radialGradient id="earthBody" cx="35%" cy="30%" r="75%">
<stop offset="0%" stop-color="#5FC7E8"/>
<stop offset="45%" stop-color="#2C7FB8"/>
<stop offset="80%" stop-color="#173F63"/>
<stop offset="100%" stop-color="#0A2038"/>
</radialGradient>
<radialGradient id="earthGlow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#7FDBFF" stop-opacity="0"/>
<stop offset="80%" stop-color="#7FDBFF" stop-opacity="0"/>
<stop offset="96%" stop-color="#9FE8FF" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#9FE8FF" stop-opacity="0"/>
</radialGradient>

<linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#1B4A7A"/>
<stop offset="50%" stop-color="#3E8FD0"/>
<stop offset="100%" stop-color="#1B4A7A"/>
</linearGradient>

<linearGradient id="satBody" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#E8E8EC"/>
<stop offset="100%" stop-color="#9AA0AC"/>
</linearGradient>
</defs>

<!-- base -->
<rect width="1200" height="180" fill="url(#deepSpace)"/>
<rect width="1200" height="180" fill="url(#nebula1)"/>
<rect x="500" width="700" height="180" fill="url(#nebula2)"/>

<!-- starfield -->
<g fill="white">
<circle cx="40" cy="25" r="1.3" opacity="0.8"/>
<circle cx="115" cy="55" r="1" opacity="0.6"/>
<circle cx="190" cy="18" r="1.6" opacity="0.9"/>
<circle cx="255" cy="85" r="1" opacity="0.6"/>
<circle cx="320" cy="35" r="1.2" opacity="0.7"/>
<circle cx="60" cy="115" r="1.1" opacity="0.6"/>
<circle cx="145" cy="140" r="1" opacity="0.5"/>
<circle cx="220" cy="130" r="1.3" opacity="0.7"/>
<circle cx="380" cy="105" r="1" opacity="0.5"/>
<circle cx="430" cy="60" r="1.2" opacity="0.6"/>
<circle cx="490" cy="20" r="1" opacity="0.5"/>
<circle cx="800" cy="30" r="1.2" opacity="0.7"/>
<circle cx="870" cy="140" r="1" opacity="0.5"/>
<circle cx="940" cy="20" r="1.4" opacity="0.8"/>
<circle cx="1000" cy="150" r="1" opacity="0.5"/>
<circle cx="1060" cy="90" r="1.2" opacity="0.6"/>
<circle cx="1130" cy="35" r="1.5" opacity="0.8"/>
<circle cx="1170" cy="120" r="1" opacity="0.5"/>
<circle cx="720" cy="70" r="1" opacity="0.5"/>
<circle cx="650" cy="140" r="1.1" opacity="0.6"/>
<circle cx="565" cy="30" r="1.2" opacity="0.65"/>
<circle cx="985" cy="65" r="1" opacity="0.5"/>
</g>

<!-- Earth, lower-left, cropped like a horizon view -->
<g transform="translate(60, 210)">
<circle r="150" fill="url(#earthGlow)"/>
<circle r="130" fill="url(#earthBody)"/>
<g fill="#2E8B57" opacity="0.55">
<ellipse cx="-30" cy="-70" rx="34" ry="18" transform="rotate(-20 -30 -70)"/>
<ellipse cx="30" cy="-95" rx="22" ry="12" transform="rotate(15 30 -95)"/>
<ellipse cx="-60" cy="-40" rx="18" ry="26" transform="rotate(10 -60 -40)"/>
<ellipse cx="20" cy="-50" rx="28" ry="14" transform="rotate(-8 20 -50)"/>
</g>
<g fill="white" opacity="0.25">
<ellipse cx="-10" cy="-110" rx="40" ry="8"/>
<ellipse cx="40" cy="-75" rx="30" ry="6"/>
<ellipse cx="-50" cy="-90" rx="24" ry="6"/>
</g>
</g>

<!-- Orbit ring, drawn as a dashed trail to imply the satellite's path -->
<ellipse cx="120" cy="60" rx="330" ry="70" fill="none" stroke="#9FE8FF" stroke-width="0.7" opacity="0.3" stroke-dasharray="1 5"/>

<!-- faint trailing echoes of the satellite along the orbit, fading out, to suggest motion -->
<g opacity="0.15">
<circle cx="330" cy="16" r="3" fill="#9FE8FF"/>
</g>
<g opacity="0.28">
<circle cx="380" cy="24" r="3.4" fill="#9FE8FF"/>
</g>
<g opacity="0.45">
<circle cx="425" cy="38" r="3.8" fill="#9FE8FF"/>
</g>

<!-- Main satellite, positioned on the orbit path -->
<g transform="translate(465, 55)">
<rect x="-9" y="-6" width="18" height="12" rx="2" fill="url(#satBody)" stroke="#5A6270" stroke-width="0.6"/>
<circle cx="9" cy="0" r="2" fill="#FFD66B"/>
<line x1="0" y1="-6" x2="0" y2="-16" stroke="#C7CCD4" stroke-width="1"/>
<circle cx="0" cy="-17" r="2" fill="#C7CCD4"/>
<rect x="-30" y="-3" width="18" height="6" fill="url(#panelGrad)" stroke="#0E2A44" stroke-width="0.4"/>
<rect x="12" y="-3" width="18" height="6" fill="url(#panelGrad)" stroke="#0E2A44" stroke-width="0.4"/>
<line x1="-9" y1="0" x2="-12" y2="0" stroke="#5A6270" stroke-width="1"/>
<line x1="9" y1="0" x2="12" y2="0" stroke="#5A6270" stroke-width="1"/>
</g>

<!-- small second satellite, far right -->
<g transform="translate(1120, 45) rotate(20)">
<rect x="-6" y="-4" width="12" height="8" rx="1.5" fill="url(#satBody)"/>
<rect x="-20" y="-2" width="12" height="4" fill="url(#panelGrad)"/>
<rect x="8" y="-2" width="12" height="4" fill="url(#panelGrad)"/>
</g>

<!-- foreground horizon wave for depth -->
<path
d="M0 150
C180 165 340 165 500 150
C680 133 810 108 1000 116
C1090 120 1150 126 1200 130
L1200 180
L0 180 Z"
fill="#050710"
opacity="0.55"/>

<!-- title -->
<text
x="600"
y="88"
text-anchor="middle"
font-family="Arial, Helvetica, sans-serif"
font-size="42"
font-weight="bold"
letter-spacing="1"
fill="white">
AI Engineer for Space Systems
</text>

<text
x="600"
y="116"
text-anchor="middle"
font-family="Arial, Helvetica, sans-serif"
font-size="14"
letter-spacing="4"
fill="#9FE8FF"
opacity="0.85">
BUILDING INTELLIGENCE BEYOND EARTH
</text>
</svg>
